# Sveltia CMS – Redaktionskonfiguration „gemeinsam wirkt e.V."
# ------------------------------------------------------------
# Diese Datei muss zu den Astro Content Collections passen (src/content.config.ts).
# Feldnamen sind bewusst identisch mit den Zod-Schemata (deutsch).

# --- Anbindung ans Git-Repo (GitHub-Backend) ---
backend:
  name: github
  repo: gemeinsam-wirkt/gemeinsam-wirkt-web
  branch: main
  # Login-Handshake über den eigenen PHP-OAuth-Vermittler (siehe oauth/README.md).
  # Läuft auf einer eigenen Hetzner-Subdomain, getrennt vom Website-Deploy.
  # Sobald GitHubs PKCE-Support nutzbar ist, entfällt dieser Schritt voraussichtlich.
  base_url: https://auth.gemeinsam-wirkt.net
  # auth_endpoint bleibt auf dem Standard 'auth' → CMS ruft …/auth auf.

# Lokaler Redaktions-Modus: `npx sveltia-cms-server` + ?npx im Dev.
# Zum Testen ohne Login:  http://localhost:4321/admin/  bei laufendem `npm run dev`
# und gestartetem Proxy `npx @sveltia/cms-server`.
local_backend: true

# --- Medien (Fallback global; pro Collection unten feiner gesetzt) ---
media_folder: public/uploads
public_folder: /uploads

# --- Mehrsprachigkeit: DE jetzt, EN strukturell vorbereitet ---
# Locales sind deklariert (i18n-fähig). Die feldweise Übersetzung wird erst
# aktiviert, wenn EN-Inhalte geschrieben werden – bis dahin bleiben die
# Markdown-Dateien flach (CLAUDE.md, Abschnitt 7).
i18n:
  structure: single_file
  locales: [de, en]
  default_locale: de

# --- Dateinamen (Slugs) ---
# Ohne identifier_field sucht das CMS ein Feld namens "title" und vergibt, wenn es
# keins findet, eine Zufalls-ID als Dateinamen (z. B. cb2b3051f104.md) - die dann
# auch in der oeffentlichen URL steht. Unsere Felder heissen "titel" bzw. "name",
# deshalb ist identifier_field bei JEDER Collection gesetzt.

collections:
  # ---------------------------------------------------------------- Veranstaltungen
  - name: veranstaltungen
    label: Veranstaltungen
    label_singular: Veranstaltung
    folder: src/content/veranstaltungen
    create: true
    slug: '{{slug}}'
    identifier_field: titel
    # Bilder relativ zur Datei → kompatibel mit Astros image()-Helper.
    media_folder: ''
    public_folder: ''
    fields:
      - { name: titel, label: Titel, widget: string }
      - { name: start, label: Beginn, widget: datetime }
      - { name: ende, label: Ende, widget: datetime, required: false }
      - { name: ort, label: Ort, widget: string }
      - { name: kurzbeschreibung, label: Kurzbeschreibung, widget: text }
      - { name: anmeldungUrl, label: Anmelde-/Ticketlink, widget: string, required: false }
      - { name: bild, label: Bild, widget: image, required: false, hint: 'Nur JPG, PNG, WebP, GIF, AVIF oder SVG – kein .jfif (wird sonst nicht angezeigt).' }
      - { name: draft, label: Entwurf (nicht veröffentlichen), widget: boolean, default: false }
      - { name: body, label: Beschreibung, widget: markdown }

  # ---------------------------------------------------------------- News
  - name: news
    label: News
    label_singular: News-Beitrag
    folder: src/content/news
    create: true
    slug: '{{slug}}'
    identifier_field: titel
    media_folder: ''
    public_folder: ''
    fields:
      - { name: titel, label: Titel, widget: string }
      - { name: datum, label: Datum, widget: datetime, time_format: false }
      - { name: teaser, label: Teaser, widget: text }
      - { name: bild, label: Bild, widget: image, required: false, hint: 'Nur JPG, PNG, WebP, GIF, AVIF oder SVG – kein .jfif (wird sonst nicht angezeigt).' }
      - { name: draft, label: Entwurf (nicht veröffentlichen), widget: boolean, default: false }
      - { name: body, label: Inhalt, widget: markdown }

  # ---------------------------------------------------------------- Projekte
  - name: projekte
    label: Projekte
    label_singular: Projekt
    folder: src/content/projekte
    create: true
    slug: '{{slug}}'
    identifier_field: titel
    media_folder: ''
    public_folder: ''
    fields:
      - { name: titel, label: Titel, widget: string }
      - { name: zusammenfassung, label: Zusammenfassung, widget: text }
      - name: status
        label: Status
        widget: select
        default: laufend
        options: [geplant, laufend, abgeschlossen]
      - name: partner
        label: Partner
        widget: relation
        required: false
        multiple: true
        collection: partner
        # Astro referenziert partner-Einträge über den Dateinamen (= slug),
        # nicht über ein Feld „id“. Daher den Slug speichern.
        value_field: '{{slug}}'
        search_fields: [name]
        display_fields: [name]
      - { name: bild, label: Bild, widget: image, required: false, hint: 'Nur JPG, PNG, WebP, GIF, AVIF oder SVG – kein .jfif (wird sonst nicht angezeigt).' }
      - { name: draft, label: Entwurf (nicht veröffentlichen), widget: boolean, default: false }
      - { name: body, label: Inhalt, widget: markdown }

  # ---------------------------------------------------------------- Podcast
  - name: podcast
    label: Podcast
    label_singular: Folge
    folder: src/content/podcast
    create: true
    slug: '{{slug}}'
    identifier_field: titel
    media_folder: ''
    public_folder: ''
    fields:
      - { name: titel, label: Titel, widget: string }
      - { name: episodennummer, label: Folgennummer, widget: number, value_type: int }
      - { name: datum, label: Datum, widget: datetime, time_format: false }
      - { name: embedUrl, label: Player-Einbettung (URL), widget: string }
      - { name: beschreibung, label: Beschreibung, widget: text }
      # Reine String-Liste – passt zu z.array(z.string()) im Schema.
      - { name: gaeste, label: Gäste, widget: list, required: false }
      - { name: draft, label: Entwurf (nicht veröffentlichen), widget: boolean, default: false }
      - { name: body, label: Transkript, widget: markdown, required: false }

  # ---------------------------------------------------------------- Vorstand
  # Eine JSON-Datei pro Person (Folder-Collection wie partner). Fotos werden
  # über das Bild-Widget nach public/team hochgeladen; im JSON steht der Pfad
  # /team/<datei> (public_folder). Reihenfolge steuert die Anzeige.
  - name: vorstand
    label: Vorstand
    label_singular: Vorstandsmitglied
    folder: src/data/vorstand
    create: true
    slug: '{{slug}}'
    extension: json
    format: json
    identifier_field: name
    media_folder: /public/team
    public_folder: /team
    fields:
      - { name: name, label: Name, widget: string }
      - { name: rolle, label: Rolle, widget: string }
      - { name: reihenfolge, label: Reihenfolge (kleinste zuerst), widget: number, value_type: int, default: 99 }
      - { name: foto, label: Foto, widget: image, required: false }
      - { name: bio, label: Kurzbiografie, widget: text }

  # ---------------------------------------------------------------- Partner & Sponsoren
  # Eine JSON-Datei pro Eintrag (Folder-Collection) – passt zum glob()-Loader und
  # dient als Ziel der Projekt-Relation. Der Dateiname = id (kebab-case).
  - name: partner
    label: Partner & Sponsoren
    label_singular: Eintrag
    folder: src/data/partner
    create: true
    slug: '{{slug}}'
    extension: json
    format: json
    identifier_field: name
    fields:
      - { name: name, label: Name, widget: string }
      - name: typ
        label: Typ
        widget: select
        options: [kooperationspartner, sponsor]
      - { name: url, label: Website, widget: string, required: false }
      - { name: logo, label: Logo (Pfad in /public), widget: string, required: false }
      # Ergänzende Info: wer der Partner/Sponsor ist und was er macht.
      - { name: beschreibung, label: Beschreibung, widget: text, required: false }

  # ---------------------------------------------------------------- Materialien
  # Verweise auf EXTERNE Quellen (Videos, Nextcloud-Freigaben, Dokumente).
  # Nichts wird selbst gehostet – nur der Link wird gepflegt. Eine JSON-Datei
  # pro Eintrag; der Dateiname = Slug.
  - name: materialien
    label: Materialien & Veröffentlichungen
    label_singular: Material
    folder: src/data/materialien
    create: true
    slug: '{{slug}}'
    extension: json
    format: json
    identifier_field: titel
    fields:
      - { name: titel, label: Titel, widget: string }
      - name: typ
        label: Typ
        widget: select
        default: video
        options: [video, dokument, audio, link]
      # Genau EINES von beidem ausfuellen:
      #  - url    -> verweist auf eine fremde Seite (YouTube, Nextcloud-Freigabe, ...)
      #  - datei  -> laedt eine eigene Datei (PDF, HTML-Seite, Bild) nach public/dokumente
      #              hoch; die Website verlinkt sie dann unter /dokumente/<dateiname>.
      # Ist beides gefuellt, gewinnt die hochgeladene Datei.
      - { name: url, label: 'Link (externe URL)', widget: string, required: false }
      - name: datei
        label: 'Eigene Datei hochladen (statt Link)'
        widget: file
        required: false
        media_folder: /public/dokumente
        public_folder: /dokumente
      - { name: quelle, label: 'Quelle (z. B. YouTube, Vimeo)', widget: string, required: false }
      - { name: beschreibung, label: Beschreibung, widget: text, required: false }
      # Nur ausfüllen, wenn der Link ein Passwort verlangt (z. B. erzwungener
      # Passwortschutz einer Nextcloud-Freigabe). Wird öffentlich angezeigt –
      # also nur für ohnehin öffentliche Dateien und kein sensibles Passwort!
      - { name: passwort, label: 'Passwort (falls Link geschützt)', widget: string, required: false }
      - { name: reihenfolge, label: Reihenfolge (kleinste zuerst), widget: number, value_type: int, default: 99 }
